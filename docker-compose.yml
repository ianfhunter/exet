services:
  exet:
    build: ./server
    ports:
      - "3080:3080"
    environment:
      PORT: "3080"
      SAVE_DIR: /data/puzzles
      STORAGE_PATH: /data/localStorage.json
      STATIC_DIR: /static
      MAX_PUZ_BYTES: "2097152"
      MAX_STORAGE_BYTES: "20971520"
    volumes:
      # Serve the Exet app (checkout root) as static files
      - .:/static:ro
      # Persist .puz uploads and the localStorage mirror
      - exet-data:/data
    restart: unless-stopped

volumes:
  exet-data:
